{% extends "layout.html" %}
{% block content %}
<style>
    /* Video Background Container */
    .video-background-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1; /* Place it behind all other content */
    }
    #bg-video {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ensure the video covers the whole area */
    }

    /* Main content alignment */
    .register-body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 72px); /* Adjust for navbar height */
        padding: 40px 0;
    }
    
    /* Glassmorphism Form Card */
    .register-card {
        background: rgba(30, 10, 50, 0.6); /* Semi-transparent dark background */
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        color: #ffffff;
        padding: 2.5rem;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .register-card h2 {
        font-weight: 700;
        margin-bottom: 1.5rem;
        text-align: center;
    }
    .register-card .form-control {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ffffff;
        border-radius: 10px;
        padding: 0.75rem 1rem;
    }
    .register-card .form-control:focus {
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.2);
        color: #ffffff;
    }
    .register-card .form-control::placeholder {
        color: rgba(255, 255, 255, 0.6);
    }
    .register-card .btn-primary {
        background-image: linear-gradient(135deg, #6A11CB 0%, #ED0E88 100%);
        border: none;
        padding: 0.75rem;
        font-weight: 600;
        border-radius: 10px;
        transition: transform 0.2s;
    }
    .register-card .btn-primary:hover {
        transform: scale(1.05);
    }
    .register-card .card-footer {
        background: none;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 1.5rem;
    }
    .register-card .card-footer a {
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
    }
    .register-card .card-footer a:hover {
        text-decoration: underline;
    }
</style>

<div class="video-background-container">
    <video playsinline autoplay muted loop id="bg-video">
        <source src="{{ url_for('static', filename='img/registrationbg.mp4') }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

<div class="register-body">
    <div class="col-lg-4 col-md-6">
        <div class="register-card">
            <h2>Create a New Account</h2>
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-block">Register</button>
                </div>
            </form>
            <div class="card-footer text-center mt-3">
                <a href="{{ url_for('login') }}">Already have an account? Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
